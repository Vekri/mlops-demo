name: MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      features:
        description: "sepal_length,sepal_width,petal_length,petal_width"
        required: true
        default: "5.1,3.5,1.4,0.2"
        type: string

jobs:
  train-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model and log the MLflow run
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: python train_mlflow.py

      - name: Reject the model if accuracy drops below 0.90
        run: |
          python -c "import joblib; from sklearn.datasets import load_iris; from sklearn.model_selection import train_test_split; from sklearn.metrics import accuracy_score; data=load_iris(); _, X_test, _, y_test = train_test_split(data.data, data.target, test_size=0.2, random_state=42); model=joblib.load('model.pkl'); acc=accuracy_score(y_test, model.predict(X_test)); print(f'accuracy={acc:.3f}'); assert acc >= 0.90, 'model accuracy is below the quality gate'"

      - name: Test the prediction API
        run: pytest test_api.py -v

      - name: Check the Streamlit app starts
        run: |
          python -m streamlit run streamlit_app.py --server.headless true --server.port 8501 --server.address 127.0.0.1 &
          pid=$!
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo
              echo "Streamlit is healthy"
              ready=1
              break
            fi
            sleep 2
          done
          kill "$pid"
          test "$ready" = "1"

      - name: Build the Docker image
        run: docker build -t mlops-demo:latest .

      - name: Smoke test the container
        env:
          FEATURES: ${{ github.event.inputs.features || '5.1,3.5,1.4,0.2' }}
        run: |
          python -c "import json,os; nums=[float(x) for x in os.environ['FEATURES'].split(',')]; assert len(nums)==4, 'Enter exactly 4 numbers'; open('body.json','w').write(json.dumps({'features': nums})); print('Predicting', nums)"
          docker run -d --name mlops-api -p 8000:8000 mlops-demo:latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              echo "API is healthy"
              break
            fi
            sleep 2
          done
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d @body.json
          echo
          docker stop mlops-api
